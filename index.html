<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1d4ed8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>ドローン資格対策</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ローディングオーバーレイ -->
  <div id="overlay-loading" class="overlay" hidden>
    <div class="spinner"></div>
    <p id="loading-msg" class="overlay-msg">読み込み中…</p>
  </div>

  <!-- エラーオーバーレイ -->
  <div id="overlay-error" class="overlay overlay--error" hidden>
    <span class="overlay-icon">⚠️</span>
    <h2>読み込みエラー</h2>
    <p id="error-msg" class="overlay-msg"></p>
    <button id="btn-error-retry" class="btn btn--primary">再試行する</button>
  </div>

  <div id="app">

    <!-- ① スタート画面 -->
    <div id="screen-start" class="screen">
      <div class="hero">
        <span class="hero__drone">🚁</span>
        <h1 class="hero__title">ドローン<br>資格対策</h1>
        <p class="hero__sub">一等・二等無人航空機操縦士</p>
      </div>

      <div class="card stat-card">
        <div class="stat-row">
          <span class="stat-row__label">総問題数</span>
          <strong id="stat-total" class="stat-row__value">読み込み中…</strong>
        </div>
        <div class="stat-row">
          <span class="stat-row__label">カテゴリ数</span>
          <strong id="stat-cats" class="stat-row__value">-</strong>
        </div>
      </div>

      <div class="card mode-card">
        <p class="card__label">出題範囲</p>
        <label class="radio-row">
          <input type="radio" name="mode" value="all" checked />
          <span class="radio-dot"></span>
          <span>全カテゴリからランダム</span>
        </label>
        <label class="radio-row" id="row-category-mode">
          <input type="radio" name="mode" value="category" />
          <span class="radio-dot"></span>
          <span>カテゴリを選んで出題</span>
        </label>
        <div id="cat-chips" class="cat-chips" hidden></div>
      </div>

      <div class="count-row">
        <span class="count-row__label">出題数</span>
        <div class="stepper">
          <button id="btn-minus" class="stepper__btn" aria-label="減らす">−</button>
          <span id="count-display" class="stepper__val">10</span>
          <button id="btn-plus" class="stepper__btn" aria-label="増やす">＋</button>
        </div>
      </div>

      <button id="btn-start" class="btn btn--primary btn--lg" disabled>
        はじめる →
      </button>
    </div>

    <!-- ② クイズ画面 -->
    <div id="screen-quiz" class="screen screen--quiz">
      <header class="quiz-header">
        <span class="quiz-header__pos">
          <b id="qn-idx">1</b>/<span id="qn-total">10</span>
        </span>
        <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <span class="quiz-header__rate"><span id="qn-rate">0</span>%</span>
      </header>

      <div class="quiz-body" id="quiz-scroll">
        <div class="card question-card">
          <span id="qn-cat" class="cat-tag"></span>
          <p id="qn-text" class="question-text"></p>
        </div>
        <div id="choices" class="choices"></div>
      </div>

      <!-- ボトムシート：フィードバック -->
      <div id="feedback-sheet" class="feedback-sheet" aria-live="assertive">
        <div class="feedback-sheet__handle"></div>
        <p id="fb-result" class="fb-result"></p>
        <p id="fb-exp" class="fb-exp"></p>
        <button id="btn-next" class="btn btn--primary">次の問題 →</button>
      </div>
    </div>

    <!-- ③ 結果画面 -->
    <div id="screen-result" class="screen screen--center">
      <p id="res-emoji" class="res-emoji"></p>
      <h2 id="res-title" class="res-title"></h2>

      <div class="ring-wrap">
        <svg viewBox="0 0 120 120" class="ring-svg" aria-hidden="true">
          <circle cx="60" cy="60" r="50" class="ring-track"/>
          <circle cx="60" cy="60" r="50" id="ring-val" class="ring-val"/>
        </svg>
        <div class="ring-inner">
          <span><b id="res-correct">0</b>/<span id="res-total">0</span></span>
          <em id="res-pct">0%</em>
        </div>
      </div>

      <div class="card cat-breakdown" id="cat-breakdown"></div>

      <div class="result-actions">
        <button id="btn-retry"    class="btn btn--primary">もう一度挑戦</button>
        <button id="btn-review"   class="btn btn--outline">間違いを復習する</button>
        <button id="btn-to-start" class="btn btn--ghost">トップに戻る</button>
      </div>
    </div>

    <!-- ④ 復習画面 -->
    <div id="screen-review" class="screen">
      <header class="sub-header">
        <button id="btn-review-back" class="btn-back" aria-label="戻る">‹</button>
        <h2>間違えた問題</h2>
        <span id="review-count" class="sub-header__count"></span>
      </header>
      <div id="review-list" class="review-list"></div>
    </div>

  </div><!-- #app -->

  <script src="app.js"></script>
</body>
</html>
